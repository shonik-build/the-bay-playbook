[build]
  publish = "."

# Serve .dc.html files with the correct type so browsers render them.
[[headers]]
  for = "/*.dc.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# Cache the runtime aggressively; it's regenerated on release, not per-edit.
[[headers]]
  for = "/support.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Preserve friendly deep-links: /apps → the apps page, /guides/visa → guides page.
[[redirects]]
  from = "/apps"
  to = "/Bay Playbook Apps.dc.html"
  status = 200

